[versions]
agp = "9.1.1"
kotlin = "2.3.21"
ksp = "2.3.7"
hilt = "2.59.2"
coreKtx = "1.16.0"
lifecycleRuntimeKtx = "2.9.0"
activityCompose = "1.10.1"
composeBom = "2026.04.01"
navigation = "2.9.0"
room = "2.8.3"
datastore = "1.1.7"
okhttp = "5.3.0"
retrofit = "3.0.0"
moshi = "1.15.2"
coil = "3.3.0"
media3 = "1.9.3"
# FFmpeg-Decoder-Extension fuer Media3 (vorgebaut, von NextPlayer-Autor).
# Version-Suffix muss zur Media3-Version passen — siehe
# https://github.com/anilbeesetti/nextlib/releases
nextlibMedia3ext = "1.9.3-0.12.0"
# nextlib-mediainfo: FFmpeg-basierter Thumbnail-/MediaInfo-Retriever.
# Gleicher Repo, gleiche Versionierung wie media3ext.
nextlibMediainfo = "1.9.3-0.12.0"
# libVLC fuer Android — vollstaendige VLC-Engine. Wird als interner
# Fallback-Player benutzt fuer Files, die ExoPlayer auch mit FFmpeg-
# Extension nicht abspielen kann. AAB-Wachstum ca. +35 MB.
# 4.0.0-eapXX = Early-Access Preview mit aktueller FFmpeg-Version —
# noetig fuer Container-Formate die 3.7.0 noch nicht kennt. Stable 3.7.0
# crasht nativ bei bestimmten MP4-Varianten (NoDeclaredBrand-Files).
libvlc = "4.0.0-eap24"
workmanager = "2.11.0"
windowSizeClass = "1.4.0"
hiltNavigationCompose = "1.2.0"
hiltWork = "1.2.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version = "1.1.0" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
